name: Application quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Public homepage and explicit management entry
        run: node --import ./tests/homepage-loader.mjs --test --test-isolation=none tests/homepage.integration.mjs
      - name: API role boundaries
        run: node --import ./tests/role-api-loader.mjs --test --test-isolation=none tests/role-api.integration.mjs
      - name: Member app integration boundaries
        run: node --import ./tests/member-api-loader.mjs --test --test-isolation=none tests/member-api.integration.mjs
      - name: Phone sign-in boundaries
        run: node --import ./tests/member-session-loader.mjs --test --test-isolation=none tests/member-session.integration.mjs
      - name: Engagement, SMS and device security boundaries
        run: node --import ./tests/role-api-loader.mjs --test --test-isolation=none tests/engagement-api.integration.mjs
      - name: Finance, HR and manual WhatsApp role boundaries
        run: node --import ./tests/role-api-loader.mjs --test --test-isolation=none tests/business-gap-api.integration.mjs
      - name: Private member conversation boundaries
        run: node --import ./tests/member-messages-loader.mjs --test --test-isolation=none tests/member-messages.integration.mjs
      - name: Manager member credential controls
        run: node --import ./tests/member-credentials-loader.mjs --test --test-isolation=none tests/member-credentials.integration.mjs
      - name: Product photo privacy
        run: node --import ./tests/role-api-loader.mjs --test --test-isolation=none tests/product-photo.integration.mjs
      - name: Simplified onboarding and task panels
        run: node --import ./tests/usability-loader.mjs --test tests/usability.integration.mjs
      - name: Unified member form interactions
        run: node --import ./tests/member-console-ui-loader.mjs --test --test-isolation=none tests/member-console-ui.integration.mjs
      - name: Barcode API with PostgreSQL policies and reservation SQL
        run: node --import ./tests/barcode-api-loader.mjs --test --test-isolation=none tests/barcode-api.integration.mjs
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low
      - name: Verify Android release signatures and original publisher
        run: node scripts/verify-android-signatures.mjs
      - run: npm run build
  windows-devices:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Native inventory classification and bridge boundaries
        run: dotnet run --project tests/windows-devices/DevicesSmoke.csproj -c Release
      - name: Windows desktop build
        run: dotnet build windows/GymOS.Windows.csproj -c Release

      - name: Publish GYMEG Windows package
        run: dotnet publish windows/GymOS.Windows.csproj -c Release -r win-x64 --self-contained true -p:EnableCompressionInSingleFile=true -o windows/gymeg-release
      - uses: actions/upload-artifact@v4
        with:
          name: GYMEG-Windows-x64
          path: windows/gymeg-release/
          retention-days: 30
