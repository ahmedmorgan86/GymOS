name: Application quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gymos_ci
          POSTGRES_PASSWORD: synthetic-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Real PostgreSQL locks and repository entity RLS
        env:
          GYMOS_CI_POSTGRES_URL: postgresql://postgres:synthetic-ci-admin@127.0.0.1:5432/gymos_ci
        run: node --import ./tests/postgres-runtime-loader.mjs --test --test-isolation=none tests/postgres-runtime.integration.mjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: API role boundaries
        run: node --import ./tests/role-api-loader.mjs --test --test-isolation=none tests/role-api.integration.mjs
      - name: Member app integration boundaries
        run: node --import ./tests/member-api-loader.mjs --test --test-isolation=none tests/member-api.integration.mjs
      - name: Phone sign-in boundaries
        run: node --import ./tests/member-session-loader.mjs --test --test-isolation=none tests/member-session.integration.mjs
      - name: Member credential provisioning
        run: node --import ./tests/member-credentials-loader.mjs --test --test-isolation=none tests/member-credentials.integration.mjs
      - name: Tenant batch serialization boundaries
        run: node --import ./tests/database-batch-loader.mjs --test --test-isolation=none tests/database-batch.integration.mjs
      - name: Reception sales visibility
        run: node --import ./tests/reception-ui-loader.mjs --test --test-isolation=none tests/reception-ui.integration.mjs
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low
      - run: npm run build
