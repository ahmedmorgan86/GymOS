تبقية: اختبار هاتف فعلي، الأجهزة والمزودين، طرح النطاق والنسخ الموقعة، وتجربة migration كاملة في بيئة منفصلة.\n\n| ID | الأولوية | الحالة | النتيجة | الدليل |\n|---|---|---|---|---|\n| A01 | P1 | FIXED | إعادة تطبيق bootstrap على قاعدة مأهولة قد تستبدل سياسات العزل | `scripts/migration-preflight.mjs:2` — حاجز يرفض القاعدة الحالية؛ تحقق PGlite دون لمس الإنتاج. |\n| A02 | P2 | FIXED | الصور المرقمة ترفضها سياسة Next Image | `next.config.ts:3` — سماح محدد لإصدارات الهوية؛ صورة قبل وبعد واختبار رفض الاستعلامات العشوائية. |\n| A03 | P2 | FIXED | توقيت أرشيف التقارير كان مثبتًا على القاهرة | `app/api/reports/export/route.ts:10` — تمرير منطقة النادي كمعامل SQL واختبار تكامل. |\n| A04 | P2 | FIXED | تاريخ التقرير غير الصالح يرجع خطأ خدمة | `app/api/reports/export/route.ts:10` — 400 للتحقق بدل 503؛ اختبار تكامل. |\n| A05 | P2 | FIXED | صور التسويق والأيقونات لا تطابق الهوية | `scripts/build-gymeg-assets.mjs:7` — صور حديثة من واجهات معاينة ببيانات وهمية؛ رموز مربعة وforeground ملون. |\n| A06 | P2 | FIXED | نافذة العضو تتجاوز شاشة الموبايل وقائمة الإجراءات تغطي المحتوى | `app/member-console.module.css:19` — نافذة ضمن viewport وقوائم داخل التدفق؛ لقطة وقياس فعليان 320px. |\n| A07 | P2 | FIXED | عرض الجدول الإجباري يخفي بيانات العضو على الموبايل | `app/member-console.module.css:22` — كروت معنونة، فرز محفوظ وإجراءات واضحة؛ عرض مقاس 279px داخل صفحة 305px. |\n| A08 | P1 | ACCEPTED_CONSTRAINT | PIN افتراضي مشترك 123456 بطلب المالك | `app/lib/member-pin.ts:1` — لم يتغير طلب المستخدم؛ الخطر قائم للحساب غير المفعل. لا يُعتبر مانعًا برمجيًا مصححًا. |\n| A09 | P2 | EXTERNAL_TEST_REQUIRED | الأجهزة والكاميرا ومزودو الرسائل لم يختبروا فعليًا | `app/device-center.tsx:10` — نجاح اختبارات التصنيف أو mock لا يثبت التوافق مع جهاز محدد أو تسليم رسالة. |\n| A10 | P2 | BLOCKED | Windows بلا شهادة Authenticode موثوقة | `windows/Sign-GYMEG.ps1:1` — بناء EXE ناجح، توقيع ناشر موثوق غير متاح. لا تعطيل حماية ولا شهادة مجانية مزعومة. |\n| A11 | P2 | OPEN | 39 تنبيه أداء RLS و6 سياسات permissive متعددة | `docs/audit/2026-10-29/database-schema-snapshot.json:1797` — من المستشار بتاريخ المراجعة؛ لا تعديل سياسات إنتاج ولا ادعاء تحسين أداء بلا قياس. |\n| A12 | P2 | OPEN | نقل المخطط الداخلي والأسماء التقنية يحتاج طرحًا منسقًا | `app/lib/database.ts:11` — اسم مشروع Supabase أصبح GymEG؛ schema gymos وحزم الهاتف ومجلد النسخ محفوظة، ولم تنفذ إعادة تسمية في الإنتاج. |\n| A13 | P2 | OPEN | نشر ملفات Windows وربط الرابط يحتاج تحقق إصدار بعيد | `app/downloads/windows/route.ts:2` — صُحح المستودع إلى gymeg؛ لم يتحقق توفر asset الجديد على GitHub؛ الملف المحلي متاح. |\n| A14 | P2 | OPEN | تغيير النطاق لا ينقل تلقائيًا التخزين المحلي والجلسات | `windows/DeploymentOrigin.cs:3` — تظل توافقات الروابط القديمة داخل المهاجر فقط؛ يجب مزامنة العمل المعلق قبل إزالة النطاق السابق. |"}, {"file": "02_SYSTEM_ARCHITECTURE_AR.md", "title": "معمارية النظام", "body": "Next.js 16.4.2 وReact 19.2.6 يقدمان الموقع ومساحة النادي وبوابة العضو والمنصة. API يتحقق من جلسة Supabase ثم يحدد النادي والفرع والصلاحيات قبل PostgreSQL. `app/lib/database.ts` يستخدم pool محدودًا وTLS مع تحقق الشهادة.\n\nWindows WPF/WebView2 يعرض الواجهة مع أدوات أجهزة وصوت ونسخ SQLite محلية مشفرة عبر DPAPI. تطبيقات Android أغلفة WebView أصلية مستقلة بمسارات إدارة/عضو/دعم؛ iPhone تطبيق ويب قابل للتثبيت وليس IPA. تخزين المتصفح والنطاق والجلسات ليس مشتركًا تلقائيًا بين النطاقات.\n\nالمخططات في `ARCHITECTURE_DIAGRAMS.md`، والكتالوج الفعلي في `database-schema-snapshot.json`. فهرسة الملفات لا تعني مراجعة يدوية كاملة لكل سطر."}, {"file": "03_DATABASE_AUDIT_AR.md", "title": "مراجعة قاعدة البيانات", "body": "لقطة كتالوج قراءة فقط بتاريخ 29 أكتوبر 2026: 28 جدولًا، 41 policy، 18 function و2 trigger. جميع الجداول في اللقطة لها RLS إجباري. لم تُنسخ بيانات أعضاء إلى التقرير.\n\nاسم المشروع GymEG؛ قاعدة postgres ومخطط gymos وrole gymos_app لم تُعد تسميتها. المشروع المعروض ليس اسم قاعدة PostgreSQL ولا إعادة إنشاء لها. إعادة التسمية تتطلب مطابقة كل SQL وfunction body وsearch_path وcron ونسخة التطبيق وتخطيط رجوع؛ لم تنفذ على الإنتاج.\n\nالمستشار: pg_net في public وحماية كلمات المرور المسربة غير مفعلة؛ أداء RLS يتضمن 39 تحذير تهيئة و6 تحذيرات سياسات متعددة و5 فهارس غير مستخدمة. لا ادعاء بأن تحذير يعني اختراقًا مؤكدًا.\n\n| الجدول | الأعمدة | RLS إجباري | FK |\n|---|---:|---|---:|\n| member_code_access | 12 | True | 1 |\n| member_code_sessions | 5 | True | 1 |\n| member_code_attempts | 3 | True | 0 |\n| membership_cards | 7 | True | 0 |\n| card_number_counters | 2 | True | 0 |\n| gym_access | 6 | True | 0 |\n| gym_states | 4 | True | 0 |\n| gym_recovery | 4 | True | 0 |\n| gym_invites | 6 | True | 0 |\n| gym_entities | 6 | True | 0 |\n| gym_photos | 3 | True | 0 |\n| gym_access_events | 7 | True | 0 |\n| commercial_plans | 10 | True | 0 |\n| tenants | 5 | True | 0 |\n| tenant_memberships | 6 | True | 1 |\n| tenant_licenses | 10 | True | 2 |\n| activation_requests | 17 | True | 2 |\n| trial_claims | 4 | True | 1 |\n| platform_settings | 3 | True | 0 |\n| gym_backup_transfers | 8 | True | 0 |\n| platform_admins | 2 | True | 0 |\n| commercial_audit | 6 | True | 0 |\n| gym_activity_archive | 5 | True | 0 |\n| whatsapp_connections | 7 | True | 1 |\n| member_portal_access | 8 | True | 1 |\n| member_faces | 6 | True | 1 |\n| whatsapp_rules | 4 | True | 1 |\n| whatsapp_outbox | 11 | True | 1 |"}, {"file": "04_CROSS_APP_INTEGRATION_AR.md", "title": "تكامل التطبيقات", "body": "الموقع والإدارة والعضو يستخدمون نفس API وقاعدة الأندية؛ لا يُفترض أن تشابه الأيقونة يعني مشاركة الجلسة بين WebView والمتصفح. تحقق tenant/branch في API مطلوب لكل طلب، وليس إخفاء زر في الواجهة فقط.\n\nمسارات التحقق تشمل: تسجيل عضو، حجز كارت، تعديل الصورة، تجديد الاشتراك، الدفع، الحضور والخروج، القياسات، التدريب، رسائل العضو، صلاحيات الموظف، دعم المنصة، المخزون والتقارير. اختبارات API تتضمن سياقات غير مسجلة وفرعًا آخر وناديًا آخر.\n\n13 مجموعة تكامل ناجحة، ويُراجع ملف النتائج لمعرفة عدد الحالات. الكاميرا والقارئ والصوت على هاتف ومزود SMS/WhatsApp غير مثبتة بهذه الاختبارات. Android الموقّع ليس اختبار تسجيل دخول فعلي."}, {"file": "05_SECURITY_AUDIT_AR.md", "title": "مراجعة الأمان", "body": "الجلسة والتصريح منفصلان: هوية المستخدم ثم عضوية النادي ثم نطاق الفروع والتراخيص. RLS دفاع إضافي؛ bootstrap القديم لا يُعاد على قاعدة مأهولة. نقل اسم schema دون مراجعة الدوال قد يكسر العزل؛ لذلك لم يُنفذ.\n\nلم تُطبع مفاتيح اتصال أو كلمات مرور، ومفاتيح التوقيع الخاصة خارج المصدر وحزمة العميل. فحص npm للإنتاج أعاد صفر ثغرات في وقت المراجعة، وهذا لا يثبت عدم وجود عيوب أعمال. فحص NuGet لم يرجع entries لثغرات؛ ظهرت NU1900 داخل البيئة المقيدة.\n\nPIN المشترك 123456 مخاطرة باقية بأمر المالك؛ الاختبارات الحالية لا تلغي خطر الاستيلاء على حساب غير مفعل. لا يتم تخفيف الحماية لإخفاء تحذيرات Windows.\n\n| ID | الأولوية | الحالة | النتيجة | الدليل |\n|---|---|---|---|---|\n| A01 | P1 | FIXED | إعادة تطبيق bootstrap على قاعدة مأهولة قد تستبدل سياسات العزل | `scripts/migration-preflight.mjs:2` — حاجز يرفض القاعدة الحالية؛ تحقق PGlite دون لمس الإنتاج. |\n| A02 | P2 | FIXED | الصور المرقمة ترفضها سياسة Next Image | `next.config.ts:3` — سماح محدد لإصدارات الهوية؛ صورة قبل وبعد واختبار رفض الاستعلامات العشوائية. |\n| A03 | P2 | FIXED | توقيت أرشيف التقارير كان مثبتًا على القاهرة | `app/api/reports/export/route.ts:10` — تمرير منطقة النادي كمعامل SQL واختبار تكامل. |\n| A04 | P2 | FIXED | تاريخ التقرير غير الصالح يرجع خطأ خدمة | `app/api/reports/export/route.ts:10` — 400 للتحقق بدل 503؛ اختبار تكامل. |\n| A05 | P2 | FIXED | صور التسويق والأيقونات لا تطابق الهوية | `scripts/build-gymeg-assets.mjs:7` — صور حديثة من واجهات معاينة ببيانات وهمية؛ رموز مربعة وforeground ملون. |\n| A06 | P2 | FIXED | نافذة العضو تتجاوز شاشة الموبايل وقائمة الإجراءات تغطي المحتوى | `app/member-console.module.css:19` — نافذة ضمن viewport وقوائم داخل التدفق؛ لقطة وقياس فعليان 320px. |\n| A07 | P2 | FIXED | عرض الجدول الإجباري يخفي بيانات العضو على الموبايل | `app/member-console.module.css:22` — كروت معنونة، فرز محفوظ وإجراءات واضحة؛ عرض مقاس 279px داخل صفحة 305px. |\n| A08 | P1 | ACCEPTED_CONSTRAINT | PIN افتراضي مشترك 123456 بطلب المالك | `app/lib/member-pin.ts:1` — لم يتغير طلب المستخدم؛ الخطر قائم للحساب غير المفعل. لا يُعتبر مانعًا برمجيًا مصححًا. |\n| A09 | P2 | EXTERNAL_TEST_REQUIRED | الأجهزة والكاميرا ومزودو الرسائل لم يختبروا فعليًا | `app/device-center.tsx:10` — نجاح اختبارات التصنيف أو mock لا يثبت التوافق مع جهاز محدد أو تسليم رسالة. |\n| A10 | P2 | BLOCKED | Windows بلا شهادة Authenticode موثوقة | `windows/Sign-GYMEG.ps1:1` — بناء EXE ناجح، توقيع ناشر موثوق غير متاح. لا تعطيل حماية ولا شهادة مجانية مزعومة. |\n| A11 | P2 | OPEN | 39 تنبيه أداء RLS و6 سياسات permissive متعددة | `docs/audit/2026-10-29/database-schema-snapshot.json:1797` — من المستشار بتاريخ المراجعة؛ لا تعديل سياسات إنتاج ولا ادعاء تحسين أداء بلا قياس. |\n| A12 | P2 | OPEN | نقل المخطط الداخلي والأسماء التقنية يحتاج طرحًا منسقًا | `app/lib/database.ts:11` — اسم مشروع Supabase أصبح GymEG؛ schema gymos وحزم الهاتف ومجلد النسخ محفوظة، ولم تنفذ إعادة تسمية في الإنتاج. |\n| A13 | P2 | OPEN | نشر ملفات Windows وربط الرابط يحتاج تحقق إصدار بعيد | `app/downloads/windows/route.ts:2` — صُحح المستودع إلى gymeg؛ لم يتحقق توفر asset الجديد على GitHub؛ الملف المحلي متاح. |\n| A14 | P2 | OPEN | تغيير النطاق لا ينقل تلقائيًا التخزين المحلي والجلسات | `windows/DeploymentOrigin.cs:3` — تظل توافقات الروابط القديمة داخل المهاجر فقط؛ يجب مزامنة العمل المعلق قبل إزالة النطاق السابق. |"}, {"file": "06_CODE_AND_BUG_REPORT_AR.md", "title": "الشيفرة والأخطاء", "body": "| ID | الأولوية | الحالة | النتيجة | الدليل |\n|---|---|---|---|---|\n| A01 | P1 | FIXED | إعادة تطبيق bootstrap على قاعدة مأهولة قد تستبدل سياسات العزل | `scripts/migration-preflight.mjs:2` — حاجز يرفض القاعدة الحالية؛ تحقق PGlite دون لمس الإنتاج. |\n| A02 | P2 | FIXED | الصور المرقمة ترفضها سياسة Next Image | `next.config.ts:3` — سماح محدد لإصدارات الهوية؛ صورة قبل وبعد واختبار رفض الاستعلامات العشوائية. |\n| A03 | P2 | FIXED | توقيت أرشيف التقارير كان مثبتًا على القاهرة | `app/api/reports/export/route.ts:10` — تمرير منطقة النادي كمعامل SQL واختبار تكامل. |\n| A04 | P2 | FIXED | تاريخ التقرير غير الصالح يرجع خطأ خدمة | `app/api/reports/export/route.ts:10` — 400 للتحقق بدل 503؛ اختبار تكامل. |\n| A05 | P2 | FIXED | صور التسويق والأيقونات لا تطابق الهوية | `scripts/build-gymeg-assets.mjs:7` — صور حديثة من واجهات معاينة ببيانات وهمية؛ رموز مربعة وforeground ملون. |\n| A06 | P2 | FIXED | نافذة العضو تتجاوز شاشة الموبايل وقائمة الإجراءات تغطي المحتوى | `app/member-console.module.css:19` — نافذة ضمن viewport وقوائم داخل التدفق؛ لقطة وقياس فعليان 320px. |\n| A07 | P2 | FIXED | عرض الجدول الإجباري يخفي بيانات العضو على الموبايل | `app/member-console.module.css:22` — كروت معنونة، فرز محفوظ وإجراءات واضحة؛ عرض مقاس 279px داخل صفحة 305px. |\n| A08 | P1 | ACCEPTED_CONSTRAINT | PIN افتراضي مشترك 123456 بطلب المالك | `app/lib/member-pin.ts:1` — لم يتغير طلب المستخدم؛ الخطر قائم للحساب غير المفعل. لا يُعتبر مانعًا برمجيًا مصححًا. |\n| A09 | P2 | EXTERNAL_TEST_REQUIRED | الأجهزة والكاميرا ومزودو الرسائل لم يختبروا فعليًا | `app/device-center.tsx:10` — نجاح اختبارات التصنيف أو mock لا يثبت التوافق مع جهاز محدد أو تسليم رسالة. |\n| A10 | P2 | BLOCKED | Windows بلا شهادة Authenticode موثوقة | `windows/Sign-GYMEG.ps1:1` — بناء EXE ناجح، توقيع ناشر موثوق غير متاح. لا تعطيل حماية ولا شهادة مجانية مزعومة. |\n| A11 | P2 | OPEN | 39 تنبيه أداء RLS و6 سياسات permissive متعددة | `docs/audit/2026-10-29/database-schema-snapshot.json:1797` — من المستشار بتاريخ المراجعة؛ لا تعديل سياسات إنتاج ولا ادعاء تحسين أداء بلا قياس. |\n| A12 | P2 | OPEN | نقل المخطط الداخلي والأسماء التقنية يحتاج طرحًا منسقًا | `app/lib/database.ts:11` — اسم مشروع Supabase أصبح GymEG؛ schema gymos وحزم الهاتف ومجلد النسخ محفوظة، ولم تنفذ إعادة تسمية في الإنتاج. |\n| A13 | P2 | OPEN | نشر ملفات Windows وربط الرابط يحتاج تحقق إصدار بعيد | `app/downloads/windows/route.ts:2` — صُحح المستودع إلى gymeg؛ لم يتحقق توفر asset الجديد على GitHub؛ الملف المحلي متاح. |\n| A14 | P2 | OPEN | تغيير النطاق لا ينقل تلقائيًا التخزين المحلي والجلسات | `windows/DeploymentOrigin.cs:3` — تظل توافقات الروابط القديمة داخل المهاجر فقط؛ يجب مزامنة العمل المعلق قبل إزالة النطاق السابق. |\n\nأُصلحت النتائج المؤكدة فقط. تعديلات الهوية الموروثة من الفرع السابق محفوظة ولم يتم reset لعمل المستخدم. الخلفية التقنية GymOS في أسماء namespaces ليست وحدها عيبًا في المنتج."}, {"file": "07_PERFORMANCE_AND_RELIABILITY_AR.md", "title": "الأداء والاعتمادية", "body": "تم تحديد pool max=3 وحدود statement/query timeout في مصدر الاتصال. لا قياس حمل أو أرقام p95/p99 منشورة ضمن هذه المراجعة؛ لا يصح الادعاء بتحسن كمي.\n\nسياسات RLS وقراءة JSON المجمعة ومسار تقارير الأرشيف تحتاج EXPLAIN على بيانات ممثلة في staging. استخدام تجارب production للكتابة أو توليد حمل غير مصرح لم يحدث.\n\nأُصلح اختلاف منطقة زمن الأرشيف، وفصل 400 للتحقق عن 503 للخدمة. إعادة حجز الباركود بعد ضياع الرد تحتفظ بنفس الهوية في الاختبارات الحالية. مخاطر انقطاع الشبكة وتعارض العمل غير المتزامن تُراجع عبر اختبارات outbox الحالية؛ لم يجر اختبار انقطاع حقيقي طويل على كل جهاز."}, {"file": "08_TESTING_AND_DEPLOYMENT_AR.md", "title": "الاختبارات والنشر", "body": "الوحدات في الجولة النهائية الأولى: 246 حالة، 239 ناجحة و7 اختيارية متجاوزة، صفر فشل. واجهة الأعضاء بعد تحسين الموبايل: 20 اختبار تكامل ناجح. يجب اعتماد ملفات نتائج أحدث إذا أُعيدت الجولة بعد هذا التقرير.\n\nنجح بناء Next قبل إضافات الموبايل، ثم أُعيد بناء نهائي بعد إزالة مسار QA؛ النتيجة النهائية محفوظة في evidence. Windows مبني x64 ذاتي الاحتواء، غير موقع Authenticode. Android الخمسة نجح بناؤها ومحاذاتها وتوقيعها بنفس الشهادات الأصلية لكل حزمة؛ فحص 11 pin نجح بعد التحديث.\n\nلم يُنفذ npm ci جديدًا؛ الاعتماديات مثبتة وفحص npm ls نجح. لا اختبار هاتف حقيقي أو AVD متاح، ولا نشر إنتاج أو دمج تلقائي. لا تُستبدل تجربة مزود رسائل باختبار mock."}, {"file": "09_PRIORITIZED_REMEDIATION_PLAN_AR.md", "title": "خطة الإصلاح ذات الأولوية", "body": "1. تثبيت نسخة المصدر الحالية في فرع تطوير وفحص build/type/lint وAPI بعد آخر تعديل.\n2. هاتف Android وiPhone: الدخول والصورة والكارت والتمرير ولوحة المفاتيح والوضع الأفقي.\n3. اختبار استرجاع نسخة قاعدة منفصلة، ثم أي نقل schema مع وظائف RLS والـ cron؛ لا تغيير اسم database postgres لأغراض تسويق.\n4. التحقق من أصل النطاق وروابط التنزيل وAuth، ومزامنة pending outbox قبل إيقاف القديم.\n5. مزودو الرسائل والأجهزة: بيانات اختبار وموافقة صريحة لإرسال فعلي أو دفع.\n6. توقيع Windows الموثوق أو قناة Store عند توفر مواردها؛ لا وعود مجانية غير مثبتة.\n7. قياس حمل على staging وتحسين تحذيرات RLS بحسب EXPLAIN، ثم تجربة طرح ورجوع قبل البيع."}, {"file": "10_MASTER_ISSUE_REGISTER_AR.md", "title": "سجل المشكلات الرئيسي", "body": "| ID | الأولوية | الحالة | النتيجة | الدليل |\n|---|---|---|---|---|\n| A01 | P1 | FIXED | إعادة تطبيق bootstrap على قاعدة مأهولة قد تستبدل سياسات العزل | `scripts/migration-preflight.mjs:2` — حاجز يرفض القاعدة الحالية؛ تحقق PGlite دون لمس الإنتاج. |\n| A02 | P2 | FIXED | الصور المرقمة ترفضها سياسة Next Image | `next.config.ts:3` — سماح محدد لإصدارات الهوية؛ صورة قبل وبعد واختبار رفض الاستعلامات العشوائية. |\n| A03 | P2 | FIXED | توقيت أرشيف التقارير كان مثبتًا على القاهرة | `app/api/reports/export/route.ts:10` — تمرير منطقة النادي كمعامل SQL واختبار تكامل. |\n| A04 | P2 | FIXED | تاريخ التقرير غير الصالح يرجع خطأ خدمة | `app/api/reports/export/route.ts:10` — 400 للتحقق بدل 503؛ اختبار تكامل. |\n| A05 | P2 | FIXED | صور التسويق والأيقونات لا تطابق الهوية | `scripts/build-gymeg-assets.mjs:7` — صور حديثة من واجهات معاينة ببيانات وهمية؛ رموز مربعة وforeground ملون. |\n| A06 | P2 | FIXED | نافذة العضو تتجاوز شاشة الموبايل وقائمة الإجراءات تغطي المحتوى | `app/member-console.module.css:19` — نافذة ضمن viewport وقوائم داخل التدفق؛ لقطة وقياس فعليان 320px. |\n| A07 | P2 | FIXED | عرض الجدول الإجباري يخفي بيانات العضو على الموبايل | `app/member-console.module.css:22` — كروت معنونة، فرز محفوظ وإجراءات واضحة؛ عرض مقاس 279px داخل صفحة 305px. |\n| A08 | P1 | ACCEPTED_CONSTRAINT | PIN افتراضي مشترك 123456 بطلب المالك | `app/lib/member-pin.ts:1` — لم يتغير طلب المستخدم؛ الخطر قائم للحساب غير المفعل. لا يُعتبر مانعًا برمجيًا مصححًا. |\n| A09 | P2 | EXTERNAL_TEST_REQUIRED | الأجهزة والكاميرا ومزودو الرسائل لم يختبروا فعليًا | `app/device-center.tsx:10` — نجاح اختبارات التصنيف أو mock لا يثبت التوافق مع جهاز محدد أو تسليم رسالة. |\n| A10 | P2 | BLOCKED | Windows بلا شهادة Authenticode موثوقة | `windows/Sign-GYMEG.ps1:1` — بناء EXE ناجح، توقيع ناشر موثوق غير متاح. لا تعطيل حماية ولا شهادة مجانية مزعومة. |\n| A11 | P2 | OPEN | 39 تنبيه أداء RLS و6 سياسات permissive متعددة | `docs/audit/2026-10-29/database-schema-snapshot.json:1797` — من المستشار بتاريخ المراجعة؛ لا تعديل سياسات إنتاج ولا ادعاء تحسين أداء بلا قياس. |\n| A12 | P2 | OPEN | نقل المخطط الداخلي والأسماء التقنية يحتاج طرحًا منسقًا | `app/lib/database.ts:11` — اسم مشروع Supabase أصبح GymEG؛ schema gymos وحزم الهاتف ومجلد النسخ محفوظة، ولم تنفذ إعادة تسمية في الإنتاج. |\n| A13 | P2 | OPEN | نشر ملفات Windows وربط الرابط يحتاج تحقق إصدار بعيد | `app/downloads/windows/route.ts:2` — صُحح المستودع إلى gymeg؛ لم يتحقق توفر asset الجديد على GitHub؛ الملف المحلي متاح. |\n| A14 | P2 | OPEN | تغيير النطاق لا ينقل تلقائيًا التخزين المحلي والجلسات | `windows/DeploymentOrigin.cs:3` — تظل توافقات الروابط القديمة داخل المهاجر فقط؛ يجب مزامنة العمل المعلق قبل إزالة النطاق السابق. |\n\nالنسخة القابلة للمعالجة الآلية `issues.json` تتضمن مصدرًا ورقم سطر وحالة وثقة. FIXED يعني عيبًا محددًا مع دليل، وليس اكتمال التطبيق بأكمله."}, {"file": "11_VISUAL_AUDIT_AR.md", "title": "مراجعة التصميم", "body": "تمت معاينة الموقع بالعربية والإنجليزية، الوضعين النهاري والليلي، وصورة العضو محليًا. في هذه الجولة صُححت نوافذ ملف العضو والتجديد والتعديل وجدول الأعضاء عند عرض فعلي 320px. لا يوجد تمدد أفقي في النافذة المختبرة.\n\nالقائمة الداخلية أصبحت ضمن تدفق المحتوى بدل absolute overlay. النوافذ تتعامل مع dvh وsafe-area. جدول الأعضاء يتحول لكروت، بينما الجداول الأخرى تُحاصر داخل scroll container وقابلة للتركيز بلوحة المفاتيح.\n\nضبط viewport للأحجام اللاحقة لم يغيّر القياس الحقيقي في أداة المتصفح؛ لا ندعي أن 390/430/768 اختبرت بنجاح في هذه الجولة. ملف `MOBILE_MANAGEMENT_FIX_AR.md` يشرح الدليل والحدود."}, {"file": "12_SCREENSHOT_INVENTORY_AR.md", "title": "فهرس لقطات الشاشة", "body": "اللقطات ملفات متصفح أصلية، ليست صورًا مولدة بالذكاء الاصطناعي. صور الإدارة التسويقية مأخوذة من مكونات الواجهة داخل غلاف معاينة مع بيانات وهمية؛ لا تُوصف كلقطة جلسة نادي إنتاج. صورة العضو من member-preview. لا صور Android فعلية متاحة.\n\n- `docs/screenshots/archived/landing-before-image-policy-fix.png` — db5201eb69051d81… (before)\n- `docs/screenshots/web/desktop/brand-members-corrected.png` — 13f498901c27d1a3… (browser-local)\n- `docs/screenshots/web/desktop/brand-reports-corrected.png` — 408d5bd63899235e… (browser-local)\n- `docs/screenshots/web/desktop/brand-shop-corrected.png` — d200d2551fd4bd14… (browser-local)\n- `docs/screenshots/web/desktop/brand-training-corrected.png` — 9f52e785050766e1… (browser-local)\n- `docs/screenshots/web/desktop/landing-ar-dark.png` — 2a35f49d3cd0165b… (browser-local)\n- `docs/screenshots/web/desktop/landing-ar-light.png` — ff057080e89ab729… (browser-local)\n- `docs/screenshots/web/desktop/landing-brand-corrected.png` — 3c1d19d9c80e69ae… (browser-local)\n- `docs/screenshots/web/desktop/landing-en-light.png` — 0c2284071ebdf8b3… (browser-local)\n- `docs/screenshots/web/mobile/brand-member-corrected.png` — e0a1e67b6fbd5979… (browser-local)\n- `docs/screenshots/web/mobile/landing-en-light.png` — 75fdf827a489cefd… (browser-local)\n- `docs/screenshots/web/mobile/management-edit-320.png` — 0f90e62c5c0356e4… (browser-local)\n- `docs/screenshots/web/mobile/management-member-cards-320.png` — 737381ef7ccde456… (browser-local)\n- `docs/screenshots/web/mobile/management-renewal-320.png` — 84e83572548e35eb… (browser-local)"}, {"file": "13_CROSS_PLATFORM_UI_COMPARISON_AR.md", "title": "مقارنة الواجهات عبر المنصات", "body": "| المنصة | المتحقق | الحدود |\n|---|---|---|\n| Web محلي | الموقع، صور الهوية، ملف العضو، تعديل وتجديد وكروت الأعضاء | بيانات وهمية، لا حفظ حقيقي بهذه المعاينة |\n| Windows | build ونسخ مشفرة وتصنيف أجهزة وأصول هوية | ملف إعادة البناء الأخير لم يُختبر بصريًا كاملًا |\n| Android إدارة/عضو/دعم | موارد وAPK وتوقيع وشهادة | لا تثبيت أو فحص هاتف فعلي |\n| iPhone | إرشادات PWA ومراعاة safe-area | لا Safari فعلي في الجولة |\n\nتوحيد المصدر يدعم اتساق الشكل لكنه لا يثبت تطابق WebView/Safari أو الصلاحيات أو فتح الملفات على كل جهاز."}, {"file": "14_DOCUMENTATION_UPDATE_REPORT_AR.md", "title": "تحديث الأدلة", "body": "أُضيفت تقارير المراجعة وفهرس JSON وصور قبل/بعد وتقرير تصحيح الهوية والموبايل. أُصلحت أرقام إصدارات التنزيل الظاهرة التي كانت مثبتة على نسخة قديمة؛ Android يعرض version من metadata. المستودع المرجعي في رابط Windows أصبح gymeg.\n\nأدلة PDF الحالية تحتاج إعادة بناء بالاسم GymEG والتاريخ والإصدارات الحالية مع فحص بصري بعد البناء. لا تُعد الملفات التاريخية في brand-history دليلًا على الهوية الحالية.\n\nمفاتيح التوقيع والأدلة الخاصة وبيانات الأندية لا تدرج في حزمة العميل. تاريخيات أسماء الحزم ضرورية للتحديث ويجب ألا تحذف من إرشادات انتقال النسخ إذا أدى ذلك لتثبيت فاشل."}, {"file": "15_VISUAL_REGRESSION_REPORT_AR.md", "title": "الانحدار البصري", "body": "قبل: صور جاهزة بهوية سابقة، عطل Next Image لبعض الاستعلامات، G يتداخل مع الدمبل، foreground أحادي في Android، ونوافذ وجداول غير مناسبة للموبايل.\n\nبعد: PNG/WebP جديدة، version query allowlist، رمز متجهي غير متداخل وأيقونات بنفس النسب، foreground ملون منفصل، ونوافذ ضمن viewport وكروت أعضاء معنونة.\n\nتحقق آلي: مقارنة pixels لأيقونات الأدوار بالمصدر المتجهي عند الدقة المعلنة، تحقق Android XML، اختبارات brand/image policies، وفحص تفاعل التعديل والتجديد ونقل التركيز. لا يوجد baseline pixel-diff شامل لجميع شاشات التطبيق ولا صور هاتف فعلي."}, {"file": "16_IMPLEMENTED_FIXES_AR.md", "title": "الإصلاحات المنفذة", "body": "- حاجز bootstrap على القاعدة الحالية مع اختبار PGlite.\n- سماح Image optimizer لاستعلامات الهوية المعتمدة فقط.\n- timezone التقارير لكل نادي وHTTP400 للتحقق.\n- GymEG outlines وأصول وأيقونات وإعادة بناء 5 APK وWindows.\n- اسم مشروع Supabase الظاهر أصبح GymEG، verified عبر API.\n- صور التسويق الخمس محدثة وذاكرة PWA بإصدار جديد.\n- نافذة العضو والقائمة الداخلية وكروت الموبايل ونقل التركيز إلى العملية.\n- حاويات جداول قابلة للتمرير والتركيز، ونسخ التنزيل من metadata.\n\n| ID | الأولوية | الحالة | النتيجة | الدليل |\n|---|---|---|---|---|\n| A01 | P1 | FIXED | إعادة تطبيق bootstrap على قاعدة مأهولة قد تستبدل سياسات العزل | `scripts/migration-preflight.mjs:2` — حاجز يرفض القاعدة الحالية؛ تحقق PGlite دون لمس الإنتاج. |\n| A02 | P2 | FIXED | الصور المرقمة ترفضها سياسة Next Image | `next.config.ts:3` — سماح محدد لإصدارات الهوية؛ صورة قبل وبعد واختبار رفض الاستعلامات العشوائية. |\n| A03 | P2 | FIXED | توقيت أرشيف التقارير كان مثبتًا على القاهرة | `app/api/reports/export/route.ts:10` — تمرير منطقة النادي كمعامل SQL واختبار تكامل. |\n| A04 | P2 | FIXED | تاريخ التقرير غير الصالح يرجع خطأ خدمة | `app/api/reports/export/route.ts:10` — 400 للتحقق بدل 503؛ اختبار تكامل. |\n| A05 | P2 | FIXED | صور التسويق والأيقونات لا تطابق الهوية | `scripts/build-gymeg-assets.mjs:7` — صور حديثة من واجهات معاينة ببيانات وهمية؛ رموز مربعة وforeground ملون. |\n| A06 | P2 | FIXED | نافذة العضو تتجاوز شاشة الموبايل وقائمة الإجراءات تغطي المحتوى | `app/member-console.module.css:19` — نافذة ضمن viewport وقوائم داخل التدفق؛ لقطة وقياس فعليان 320px. |\n| A07 | P2 | FIXED | عرض الجدول الإجباري يخفي بيانات العضو على الموبايل | `app/member-console.module.css:22` — كروت معنونة، فرز محفوظ وإجراءات واضحة؛ عرض مقاس 279px داخل صفحة 305px. |\n| A08 | P1 | ACCEPTED_CONSTRAINT | PIN افتراضي مشترك 123456 بطلب المالك | `app/lib/member-pin.ts:1` — لم يتغير طلب المستخدم؛ الخطر قائم للحساب غير المفعل. لا يُعتبر مانعًا برمجيًا مصححًا. |\n| A09 | P2 | EXTERNAL_TEST_REQUIRED | الأجهزة والكاميرا ومزودو الرسائل لم يختبروا فعليًا | `app/device-center.tsx:10` — نجاح اختبارات التصنيف أو mock لا يثبت التوافق مع جهاز محدد أو تسليم رسالة. |\n| A10 | P2 | BLOCKED | Windows بلا شهادة Authenticode موثوقة | `windows/Sign-GYMEG.ps1:1` — بناء EXE ناجح، توقيع ناشر موثوق غير متاح. لا تعطيل حماية ولا شهادة مجانية مزعومة. |\n| A11 | P2 | OPEN | 39 تنبيه أداء RLS و6 سياسات permissive متعددة | `docs/audit/2026-10-29/database-schema-snapshot.json:1797` — من المستشار بتاريخ المراجعة؛ لا تعديل سياسات إنتاج ولا ادعاء تحسين أداء بلا قياس. |\n| A12 | P2 | OPEN | نقل المخطط الداخلي والأسماء التقنية يحتاج طرحًا منسقًا | `app/lib/database.ts:11` — اسم مشروع Supabase أصبح GymEG؛ schema gymos وحزم الهاتف ومجلد النسخ محفوظة، ولم تنفذ إعادة تسمية في الإنتاج. |\n| A13 | P2 | OPEN | نشر ملفات Windows وربط الرابط يحتاج تحقق إصدار بعيد | `app/downloads/windows/route.ts:2` — صُحح المستودع إلى gymeg؛ لم يتحقق توفر asset الجديد على GitHub؛ الملف المحلي متاح. |\n| A14 | P2 | OPEN | تغيير النطاق لا ينقل تلقائيًا التخزين المحلي والجلسات | `windows/DeploymentOrigin.cs:3` — تظل توافقات الروابط القديمة داخل المهاجر فقط؛ يجب مزامنة العمل المعلق قبل إزالة النطاق السابق. |"}, {"file": "17_FINAL_SYSTEM_READINESS_AR.md", "title": "الجاهزية النهائية", "body": "الحكم: مرشح تسليم محلي؛ ليس اعتمادًا نهائيًا للبيع دون استكمال بوابات التشغيل الخارجية. لم يُنشر أو يُدمج ضمن المراجعة.\n\nالمكتمل بدليل: إصلاحات محددة، اختبارات وحدة/API، أصول الهوية، بناء APK والتحقق من التوقيع، بناء Windows، ومراجعة catalog فقط لقاعدة الإنتاج.\n\nغير المكتمل: تثبيت APK/تجربة iPhone، أجهزة فعليًا، رسائل SMS/WhatsApp فعلية، رابط Windows البعيد الجديد، تغيير schema الداخلي مع نشر منسق، قياس حمل وrestore كامل في staging. لا يمكن ضمان صفر أخطاء. نتائج الاختبار تُرفق بالتسليم بدل وصف النظام بأنه كامل بلا قيود."}, {"file": "18_BRANDING_AND_LOGO_AUDIT_AR.md", "title": "مراجعة الهوية واللوجو", "body": "الاسم الرسمي GymEG، ويظهر داخل الملفات المتجهية كمسارات outlined بنفس الحالة. الرمز G/دمبل مفصول عن النص في الأيقونات الصغيرة. اللونان #7C3AED و#A855F7 مع #12101C و#F5F3FF. Cairo للنصوص العربية.\n\nصُحح تداخل G/الدمبل، واستخدم الرمز المربع في كل أحجام الأيقونات لمنع تغير الرسم بحسب المقاس. النسخة الكاملة المكتوبة أفقي/مربع/رأسي مستقلة، وWindows splash رمز مع عنوان نصي واضح. الأصل متجهي أصلي وليس قصًا من لوحة الهوية المرفقة.\n\nبعض المعرفات الداخلية gymos/com.pushtorq تبقى لأغراض توافق التثبيت والبيانات. لا تظهر كرابط تسويقي قديم، وليست دليلًا وحدها على أن الهوية لم تتغير."}, {"file": "19_GYMEG_BRAND_ASSET_MANIFEST_AR.md", "title": "
