هذه التعديلات.\r\n\r\nالنتيجة: نسخة مرشحة محلية مع قيود معلنة، وليست إقرارًا بخلو النظام من الأخطاء أو جاهزية كل تكامل خارجي. أهم البوابات المتبقية: اختبار هاتف فعلي، الأجهزة والمزودين، طرح النطاق والنسخ الموقعة، وتجربة migration كاملة في بيئة منفصلة.\r\n\r\n| ID | الأولوية | الحالة | النتيجة | الدليل |\r\n|---|---|---|---|---|\r\n| A01 | P1 | FIXED | إعادة تطبيق bootstrap على قاعدة مأهولة قد تستبدل سياسات العزل | `scripts/migration-preflight.mjs:2` — حاجز يرفض القاعدة الحالية؛ تحقق PGlite دون لمس الإنتاج. |\r\n| A02 | P2 | FIXED | الصور المرقمة ترفضها سياسة Next Image | `next.config.ts:3` — سماح محدد لإصدارات الهوية؛ صورة قبل وبعد واختبار رفض الاستعلامات العشوائية. |\r\n| A03 | P2 | FIXED | توقيت أرشيف التقارير كان مثبتًا على القاهرة | `app/api/reports/export/route.ts:10` — تمرير منطقة النادي كمعامل SQL واختبار تكامل. |\r\n| A04 | P2 | FIXED | تاريخ التقرير غير الصالح يرجع خطأ خدمة | `app/api/reports/export/route.ts:10` — 400 للتحقق بدل 503؛ اختبار تكامل. |\r\n| A05 | P2 | FIXED | صور التسويق والأيقونات لا تطابق الهوية | `scripts/build-gymeg-assets.mjs:7` — صور حديثة من واجهات معاينة ببيانات وهمية؛ رموز مربعة وforeground ملون. |\r\n| A06 | P2 | FIXED | نافذة العضو تتجاوز شاشة الموبايل وقائمة الإجراءات تغطي المحتوى | `app/member-console.module.css:19` — نافذة ضمن viewport وقوائم داخل التدفق؛ لقطة وقياس فعليان 320px. |\r\n| A07 | P2 | FIXED | عرض الجدول الإجباري يخفي بيانات العضو على الموبايل | `app/member-console.module.css:22` — كروت معنونة، فرز محفوظ وإجراءات واضحة؛ عرض مقاس 279px داخل صفحة 305px. |\r\n| A08 | P1 | ACCEPTED_CONSTRAINT | PIN افتراضي مشترك 123456 بطلب المالك | `app/api/member-code/route.ts:15` — لم يتغير طلب المستخدم؛ الخطر قائم للحساب غير المفعل. لا يُعتبر مانعًا برمجيًا مصححًا. |\r\n| A09 | P2 | EXTERNAL_TEST_REQUIRED | الأجهزة والكاميرا ومزودو الرسائل لم يختبروا فعليًا | `app/device-center.tsx:10` — نجاح اختبارات التصنيف أو mock لا يثبت التوافق مع جهاز محدد أو تسليم رسالة. |\r\n| A10 | P2 | BLOCKED | Windows بلا شهادة Authenticode موثوقة | `windows/Sign-GYMEG.ps1:1` — بناء EXE ناجح، توقيع ناشر موثوق غير متاح. لا تعطيل حماية ولا شهادة مجانية مزعومة. |\r\n| A11 | P2 | OPEN | 39 تنبيه أداء RLS و6 سياسات permissive متعددة | `docs/audit/2026-10-29/database-schema-snapshot.json:1797` — من المستشار بتاريخ المراجعة؛ لا تعديل سياسات إنتاج ولا ادعاء تحسين أداء بلا قياس. |\r\n| A12 | P2 | OPEN | نقل المخطط الداخلي والأسماء التقنية يحتاج طرحًا منسقًا | `app/lib/database.ts:11` — اسم مشروع Supabase أصبح GymEG؛ schema gymos وحزم الهاتف ومجلد النسخ محفوظة، ولم تنفذ إعادة تسمية في الإنتاج. |\r\n| A13 | P2 | OPEN | نشر ملفات Windows وربط الرابط يحتاج تحقق إصدار بعيد | `app/downloads/windows/route.ts:2` — صُحح المستودع إلى gymeg؛ لم يتحقق توفر asset الجديد على GitHub؛ الملف المحلي متاح. |\r\n| A14 | P2 | OPEN | تغيير النطاق لا ينقل تلقائيًا التخزين المحلي والجلسات | `windows/DeploymentOrigin.cs:3` — تظل توافقات الروابط القديمة داخل المهاجر فقط؛ يجب مزامنة العمل المعلق قبل إزالة النطاق السابق. |\r\n\r\n## حدود الاستدلال\r\n\r\nالنتائج خاصة بالأدلة المتاحة وقت المراجعة. راجع issues.json ونتائج evidence؛ لا تعني الفهرسة أو نجاح mock اكتمال تجربة جهاز أو مزود خارجي.\r\n"},{"file":"02_SYSTEM_ARCHITECTURE_AR.md","title":"معمارية النظام","body":"# معمارية النظام — GymEG\r\n\r\nتاريخ التقرير: 29 أكتوبر 2026 — فرع codex/gymeg-full-audit-20261029، baseline ce1a426 مع تعديلات موثقة.\r\n\r\nNext.js 16.4.2 وReact 19.2.6 يقدمان الموقع ومساحة النادي وبوابة العضو والمنصة. API يتحقق من جلسة Supabase ثم يحدد النادي والفرع والصلاحيات قبل PostgreSQL. `app/lib/database.ts` يستخدم pool محدودًا وTLS مع تحقق الشهادة.\r\n\r\nWindows WPF/WebView2 يعرض الواجهة مع أدوات أجهزة وصوت ونسخ SQLite محلية مشفرة عبر DPAPI. تطبيقات Android أغلفة WebView أصلية مستقلة بمسارات إدارة/عضو/دعم؛ iPhone تطبيق ويب قابل للتثبيت وليس IPA. تخزين المتصفح والنطاق والجلسات ليس مشتركًا تلقائيًا بين النطاقات.\r\n\r\nالمخططات في `ARCHITECTURE_DIAGRAMS.md`، والكتالوج الفعلي في `database-schema-snapshot.json`. فهرسة الملفات لا تعني مراجعة يدوية كاملة لكل سطر.\r\n\r\n## حدود الاستدلال\r\n\r\nالنتائج خاصة بالأدلة المتاحة وقت المراجعة. راجع issues.json ونتائج evidence؛ لا تعني الفهرسة أو نجاح mock اكتمال تجربة جهاز أو مزود خارجي.\r\n"},{"file":"03_DATABASE_AUDIT_AR.md","title":"مراجعة قاعدة البيانات","body":"# مراجعة قاعدة البيانات — GymEG\r\n\r\nتاريخ التقرير: 29 أكتوبر 2026 — فرع codex/gymeg-full-audit-20261029، baseline ce1a426 مع تعديلات موثقة.\r\n\r\nلقطة كتالوج قراءة فقط بتاريخ 29 أكتوبر 2026: 28 جدولًا، 41 policy، 18 function و2 trigger. جميع الجداول في اللقطة لها RLS إجباري. لم تُنسخ بيانات أعضاء إلى التقرير.\r\n\r\nاسم المشروع GymEG؛ قاعدة postgres ومخطط gymos وrole gymos_app لم تُعد تسميتها. المشروع المعروض ليس اسم قاعدة PostgreSQL ولا إعادة إنشاء لها. إعادة التسمية تتطلب مطابقة كل SQL وfunction body وsearch_path وcron ونسخة التطبيق وتخطيط رجوع؛ لم تنفذ على الإنتاج.\r\n\r\nالمستشار: pg_net في public وحماية كلمات المرور المسربة غير مفعلة؛ أداء RLS يتضمن 39 تحذير تهيئة و6 تحذيرات سياسات متعددة و5 فهارس غير مستخدمة. لا ادعاء بأن تحذير يعني اختراقًا مؤكدًا.\r\n\r\n| الجدول | الأعمدة | RLS إجباري | FK |\r\n|---|---:|---|---:|\r\n| member_code_access | 12 | True | 1 |\r\n| member_code_sessions | 5 | True | 1 |\r\n| member_code_attempts | 3 | True | 0 |\r\n| membership_cards | 7 | True | 0 |\r\n| card_number_counters | 2 | True | 0 |\r\n| gym_access | 6 | True | 0 |\r\n| gym_states | 4 | True | 0 |\r\n| gym_recovery | 4 | True | 0 |\r\n| gym_invites | 6 | True | 0 |\r\n| gym_entities | 6 | True | 0 |\r\n| gym_photos | 3 | True | 0 |\r\n| gym_access_events | 7 | True | 0 |\r\n| commercial_plans | 10 | True | 0 |\r\n| tenants | 5 | True | 0 |\r\n| tenant_memberships | 6 | True | 1 |\r\n| tenant_licenses | 10 | True | 2 |\r\n| activation_requests | 17 | True | 2 |\r\n| trial_claims | 4 | True | 1 |\r\n| platform_settings | 3 | True | 0 |\r\n| gym_backup_transfers | 8 | True | 0 |\r\n| platform_admins | 2 | True | 0 |\r\n| commercial_audit | 6 | True | 0 |\r\n| gym_activity_archive | 5 | True | 0 |\r\n| whatsapp_connections | 7 | True | 1 |\r\n| member_portal_access | 8 | True | 1 |\r\n| member_faces | 6 | True | 1 |\r\n| whatsapp_rules | 4 | True | 1 |\r\n| whatsapp_outbox | 11 | True | 1 |\r\n\r\n## حدود الاستدلال\r\n\r\nالنتائج خاصة بالأدلة المتاحة وقت المراجعة. راجع issues.json ونتائج evidence؛ لا تعني الفهرسة أو نجاح mock اكتمال تجربة جهاز أو مزود خارجي.\r\n"},{"file":"04_CROSS_APP_INTEGRATION_AR.md","title":"تكامل التطبيقات","body":"# تكامل التطبيقات — GymEG\r\n\r\nتاريخ التقرير: 29 أكتوبر 2026 — فرع codex/gymeg-full-audit-20261029، baseline ce1a426 مع تعديلات موثقة.\r\n\r\nالموقع والإدارة والعضو يستخدمون نفس API وقاعدة الأندية؛ لا يُفترض أن تشابه الأيقونة يعني مشاركة الجلسة بين WebView والمتصفح. تحقق tenant/branch في API مطلوب لكل طلب، وليس إخفاء زر في الواجهة فقط.\r\n\r\nمسارات التحقق تشمل: تسجيل عضو، حجز كارت، تعديل الصورة، تجديد الاشتراك، الدفع، الحضور والخروج، القياسات، التدريب، رسائل العضو، صلاحيات الموظف، دعم المنصة، المخزون والتقارير. اختبارات API تتضمن سياقات غير مسجلة وفرعًا آخر وناديًا آخر.\r\n\r\n13 مجموعة تكامل ناجحة، ويُراجع ملف النتائج لمعرفة عدد الحالات. الكاميرا والقارئ والصوت على هاتف ومزود SMS/WhatsApp غير مثبتة بهذه الاختبارات. Android الموقّع ليس اختبار تسجيل دخول فعلي.\r\n\r\n## حدود الاستدلال\r\n\r\nالنتائج خاصة بالأدلة المتاحة وقت المراجعة. راجع issues.json ونتائج evidence؛ لا تعني الفهرسة أو نجاح mock اكتمال تجربة جهاز أو مزود خارجي.\r\n"},{"file":"05_SECURITY_AUDIT_AR.md","title":"مراجعة الأمان","body":"# مراجعة الأمان — GymEG\r\n\r\nتاريخ التقرير: 29 أكتوبر 2026 — فرع codex/gymeg-full-audit-20261029، baseline ce1a426 مع تعديلات موثقة.\r\n\r\nالجلسة والتصريح منفصلان: هوية المستخدم ثم عضوية النادي ثم نطاق الفروع والتراخيص. RLS دفاع إضافي؛ bootstrap القديم لا يُعاد على قاعدة مأهولة. نقل اسم schema دون مراجعة الدوال قد يكسر العزل؛ لذلك لم يُنفذ.\r\n\r\nلم تُطبع مفاتيح اتصال أو كلمات مرور، ومفاتيح التوقيع الخاصة خارج المصدر وحزمة العميل. فحص npm للإنتاج أعاد صفر ثغرات في وقت المراجعة، وهذا لا يثبت عدم وجود عيوب أعمال. فحص NuGet لم يرجع entries لثغرات؛ ظهرت NU1900 داخل البيئة المقيدة.\r\n\r\nPIN المشترك 123456 مخاطرة باقية بأمر المالك؛ الاختبارات الحالية لا تلغي خطر الاستيلاء على حساب غير مفعل. لا يتم تخفيف الحماية لإخفاء تحذيرات Windows.\r\n\r\n| ID | الأولوية | الحالة | النتيجة | الدليل |\r\n|---|---|---|---|---|\r\n| A01 | P1 | FIXED | إعادة تطبيق bootstrap على قاعدة مأهولة قد تستبدل سياسات العزل | `scripts/migration-preflight.mjs:2` — حاجز يرفض القاعدة الحالية؛ تحقق PGlite دون لمس الإنتاج. |\r\n| A02 | P2 | FIXED | الصور المرقمة ترفضها سياسة Next Image | `next.config.ts:3` — سماح محدد لإصدارات الهوية؛ صورة قبل وبعد واختبار رفض الاستعلامات العشوائية. |\r\n| A03 | P2 | FIXED | توقيت أرشيف التقارير كان مثبتًا على القاهرة | `app/api/reports/export/route.ts:10` — تمرير منطقة النادي كمعامل SQL واختبار تكامل. |\r\n| A04 | P2 | FIXED | تاريخ التقرير غير الصالح يرجع خطأ خدمة | `app/api/reports/export/route.ts:10` — 400 للتحقق بدل 503؛ اختبار تكامل. |\r\n| A05 | P2 | FIXED | صور التسويق والأيقونات لا تطابق الهوية | `scripts/build-gymeg-assets.mjs:7` — صور حديثة من واجهات معاينة ببيانات وهمية؛ رموز مربعة وforeground ملون. |\r\n| A06 | P2 | FIXED | نافذة العضو تتجاوز شاشة الموبايل وقائمة الإجراءات تغطي المحتوى | `app/member-console.module.css:19` — نافذة ضمن viewport وقوائم داخل التدفق؛ لقطة وقياس فعليان 320px. |\r\n| A07 | P2 | FIXED | عرض الجدول الإجباري يخفي بيانات العضو على الموبايل | `app/member-console.module.css:22` — كروت معنونة، فرز محفوظ وإجراءات واضحة؛ عرض مقاس 279px داخل صفحة 305px. |\r\n| A08 | P1 | ACCEPTED_CONSTRAINT | PIN افتراضي مشترك 123456 بطلب المالك | `app/api/member-code/route.ts:15` — لم يتغير طلب المستخدم؛ الخطر قائم للحساب غير المفعل. لا يُعتبر مانعًا برمجيًا مصححًا. |\r\n| A09 | P2 | EXTERNAL_TEST_REQUIRED | الأجهزة والكاميرا ومزودو الرسائل لم يختبروا فعليًا | `app/device-center.tsx:10` — نجاح اختبارات التصنيف أو mock لا يثبت التوافق مع جهاز محدد أو تسليم رسالة. |\r\n| A10 | P2 | BLOCKED | Windows بلا شهادة Authenticode موثوقة | `windows/Sign-GYMEG.ps1:1` — بناء EXE ناجح، توقيع ناشر موثوق غير متاح. لا تعطيل حماية ولا شهادة يث.\r\n\r\nلم يُنفذ npm ci جديدًا؛ الاعتماديات مثبتة وفحص npm ls نجح. لا اختبار هاتف حقيقي أو AVD متاح، ولا نشر إنتاج أو دمج تلقائي. لا تُستبدل تجربة مزود رسائل باختبار mock.\r\n\r\n## حدود الاستدلال\r\n\r\nالنتائج خاصة بالأدلة المتاحة وقت المراجعة. راجع issues.json ونتائج evidence؛ لا تعني الفهرسة أو نجاح mock اكتمال تجربة جهاز أو مزود خارجي.\r\n"},{"file":"09_PRIORITIZED_REMEDIATION_PLAN_AR.md","title":"خطة الإصلاح ذات الأولوية","body":"# خطة الإصلاح ذات الأولوية — GymEG\r\n\r\nتاريخ التقرير: 29 أكتوبر 2026 — فرع codex/gymeg-full-audit-20261029، baseline ce1a426 مع تعديلات موثقة.\r\n\r\n1. تثبيت نسخة المصدر الحالية في فرع تطوير وفحص build/type/lint وAPI بعد آخر تعديل.\r\n2. هاتف Android وiPhone: الدخول والصورة والكارت والتمرير ولوحة المفاتيح والوضع الأفقي.\r\n3. اختبار استرجاع نسخة قاعدة منفصلة، ثم أي نقل schema مع وظائف RLS والـ cron؛ لا تغيير اسم database postgres لأغراض تسويق.\r\n4. التحقق من أصل النطاق وروابط التنزيل وAuth، ومزامنة pending outbox قبل إيقاف القديم.\r\n5. مزودو الرسائل والأجهزة: بيانات اختبار وموافقة صريحة لإرسال فعلي أو دفع.\r\n6. توقيع Windows الموثوق أو قناة Store عند توفر مواردها؛ لا وعود مجانية غير مثبتة.\r\n7. قياس حمل على staging وتحسين تحذيرات RLS بحسب EXPLAIN، ثم تجربة طرح ورجوع قبل البيع.\r\n\r\n## حدود الاستدلال\r\n\r\nالنتائج خاصة بالأدلة المتاحة وقت المراجعة. راجع issues.json ونتائج evidence؛ لا تعني الفهرسة أو نجاح mock اكتمال تجربة جهاز أو مزود خارجي.\r\n"},{"file":"10_MASTER_ISSUE_REGISTER_AR.md","title":"سجل المشكلات الرئيسي","body":"# سجل المشكلات الرئيسي — GymEG\r\n\r\nتاريخ التقرير: 29 أكتوبر 2026 — فرع codex/gymeg-full-audit-20261029، baseline ce1a426 مع تعديلات موثقة.\r\n\r\n| ID | الأولوية | الحالة | النتيجة | الدليل |\r\n|---|---|---|---|---|\r\n| A01 | P1 | FIXED | إعادة تطبيق bootstrap على قاعدة مأهولة قد تستبدل سياسات العزل | `scripts/migration-preflight.mjs:2` — حاجز يرفض القاعدة الحالية؛ تحقق PGlite دون لمس الإنتاج. |\r\n| A02 | P2 | FIXED | الصور المرقمة ترفضها سياسة Next Image | `next.config.ts:3` — سماح محدد لإصدا د | `app/downloads/windows/route.ts:2` — صُحح المستودع إلى gymeg؛ لم يتحقق توفر asset الجديد على GitHub؛ الملف المحلي متاح. |\r\n| A14 | P2 | OPEN | تغيير النطاق لا ينقل تلقائيًا التخزين المحلي والجلسات | `windows/DeploymentOrigin.cs:3` — تظل توافقات الروابط القديمة داخل المهاجر فقط؛ يجب مزامنة العمل المعلق قبل إزالة النطاق السابق. |\r\n\r\nالنسخة القابلة للمعالجة الآلية `issues.json` تتضمن مصدرًا ورقم سطر وحالة وثقة. FIXED يعني عيبًا محددًا مع دليل، وليس اكتمال التطبيق بأكمله.\r\n\r\n## حدود الاستدلال\r\n\r\nالنتائج خاصة بالأدلة المتاحة وقت المراجعة. راجع issues.json ونتائج evidence؛ لا تعني الفهرسة أو نجاح mock اكتمال تجربة جهاز أو مزود خارجي.\r\n"},{"file":"11_VISUAL_AUDIT_AR.md","title":"مراجعة التصميم","body":"# مراجعة التصميم — GymEG\r\n\r\nتاريخ التقرير: 29 أكتوبر 2026 — فرع codex/gymeg-full-audit-20261029، baseline ce1a426 مع تعديلات موثقة.\r\n\r\nتمت معاينة الموقع بالعربية والإنجليزية، الوضعين النهاري والليلي، وصورة العضو محليًا. في هذه الجولة صُححت نوافذ ملف العضو والتجديد والتعديل وجدول الأعضاء عند عرض فعلي 320px. لا يوجد تمدد أفقي في النافذة المختبرة.\r\n\r\nالقائمة الداخلية أصبحت ضمن تدفق المحتوى بدل absolute overlay. النوافذ تتعامل مع dvh وsafe-area. جدول الأعضاء يتحول لكروت، بينما الجداول الأخرى تُحاصر داخل scroll container وقابلة للتركيز بلوحة المفاتيح.\r\n\r\nضبط viewport للأحجام اللاحقة لم يغيّر القياس الحقيقي في أداة المتصفح؛ لا ندعي أن 390/430/768 اختبرت بنجاح في هذه الجولة. ملف `MOBILE_MANAGEMENT_FIX_AR.md` يشرح الدليل والحدود.\r\n\r\n## حدود الاستدلال\r\n\r\nالنتائج خاصة بالأدلة المتاحة وقت المراجعة. راجع issues.json ونتائج evidence؛ لا تعني الفهرسة أو نجاح mock اكتمال تجربة جهاز أو مزود خارجي.\r\n"},{"file":"12_SCREENSHOT_INVENTORY_AR.md","title":"فهرس لقطات الشاشة","body":"# فهرس لقطات الشاشة — GymEG\r\n\r\nتاريخ التقرير: 29 أكتوبر 2026 — فرع codex/gymeg-full-audit-20261029، baseline ce1a426 مع تعديلات موثقة.\r\n\r\nاللقطات ملفات متصفح أصلية، ليست صورًا مولدة بالذكاء الاصطناعي. صور الإدارة التسويقية مأخوذة من مكونات الواجهة داخل غلاف معاينة م  A05 | P2 | FIXED | صور التسويق والأيقونات لا تطابق الهوية | `scripts/build-gymeg-assets.mjs:7` — صور حديثة من واجهات معاينة ببيانات وهمية؛ رموز مربعة وforeground ملون. |\r\n| A06 | P2 | FIXED | نافذة العضو تتجاوز شاشة الموبايل وقائمة الإجراءات تغطي المحتوى | `app/member-console.module.css:19` — نافذة ضمن viewport وقوائم داخل التدفق؛ لقطة وقياس فعليان 320px. |\r\n| A07 | P2 | FIXED | عرض الجدول الإجباري يخفي بيانات العضو على الموبايل | `app/member-console.module.css:22` — كروت معنونة، فرز محفوظ وإجراءات واضحة؛ عرض مقاس 279px داخل صفحة 305px. |\r\n| A08 | P1 | ACCEPTED_CONSTRAINT | PIN افتراضي مشترك 123456 بطلب المالك | `app/api/member-code/route.ts:15` — لم يتغير طلب المستخدم؛ الخطر قائم للحساب غير المفعل. لا يُعتبر مانعًا برمجيًا مصححًا. |\r\n| A09 | P2 | EXTERNAL_TEST_REQUIRED | الأجهزة والكاميرا ومزودو الرسائل لم يختبروا فعليًا | `app/device-center.tsx:10` — نجاح اختبارات التصنيف أو mock لا يثبت التوافق مع جهاز محدد أو تسليم رسالة. |\r\n| A10 | P2 | BLOCKED | Windows بلا شهادة Authenticode موثوقة | `windows/Sign-GYMEG.ps1:1` — بناء EXE ناجح، توقيع ناشر موثوق غير متاح. لا تعطيل حماية ولا شهادة مجانية مزعومة. |\r\n| A11 | P2 | OPEN | 39 تنبيه أداء RLS و6 سياسات permissive متعددة | `docs/audit/2026-10-29/database-schema-snapshot.json:1797` — من المستشار بتاريخ المراجعة؛ لا تعديل سياسات إنتاج ولا ادعاء تحسين أداء بلا قياس. |\r\n| A12 | P2 | OPEN | نقل المخطط الداخلي والأسماء التقنية يحتاج طرحًا منسقًا | `app/lib/database.ts:11` — اسم مشروع Supabase أصبح GymEG؛ schema gymos وحزم الهاتف ومجلد النسخ محفوظة، ولم تنفذ إعادة تسمية في الإنتاج. |\r\n| A13 | P2 | OPEN | نشر ملفات Windows وربط الرابط يحتاج تحقق إصدار بعيد | `app/downloads/windows/route.ts:2` — صُحح المستودع إلى gymeg؛ لم يتحقق توفر asset الجديد على GitHub؛ الملف المحلي متاح. |\r\n| A14 | P2 | OPEN | تغيير النطاق لا ينقل تلقائيًا التخزين المحلي والجلسات | `windows/DeploymentOrigin.cs:3` — تظل توافقات الروابط القديمة داخل المهاجر فقط؛ يجب مزامنة العمل المعلق قبل إزالة النطاق السابق. |\r\n\r\n## حدود الاستدلال\r\  ونتائج evidence؛ لا تعني الفهرسة أو نجاح mock اكتمال تجربة جهاز أو مزود خارجي.\r\n"},{"file":"19_GYMEG_BRAND_ASSET_MANIFEST_AR.md","title":"فهرس أصول الهوية","body":"# فهرس أصول الهوية — GymEG\r\n\r\nتاريخ التقرير: 29 أكتوبر 2026 — فرع codex/gymeg-full-audit-20261029، baseline ce1a426 مع تعديلات موثقة.\r\n\r\nالمصدر: `tools/identity-preview/gymeg-logo.py`، والتحويلات `scripts/build-gymeg-assets.mjs`.\r\n\r\n- public/brand/logo-{dark,light,mono,print}.svg/png\r\n- public/brand/logo-{vertical,square}-{dark,light,mono,print}.svg/png\r\n- symbol variants وcompact-icon.svg وapp-icon.svg\r\n- public/icons: 16/24/32/48/64/128/180/192/256/512/1024 وmaskable.\r\n- public/favicon.ico وwindows/GymOS.ico متعدد الدقات؛ windows/SplashLogo.png بدقة 1024.\r\n- Android density mipmap وadaptive XML وmonochrome منفصل.\r\n\r\nالبصمات الدقيقة للأصول في `brand-asset-manifest.json`، وتوقيعات APK في `docs/identity/android-signing-certificates.json`. لا مفاتيح خاصة ضمن الفهرس.\r\n\r\n## حدود الاستدلال\r\n\r\nالنتائج خاصة بالأدلة المتاحة وقت المراجعة. راجع issues.json ونتائج evidence؛ لا تعني الفهرسة أو نجاح mock اكتمال تجربة جهاز أو مزود خارجي.\r\n"},{"file":"20_CROSS_PLATFORM_BRANDING_VERIFICATION_AR.md","title":"التحقق من الهوية عبر المنصات","body":"# التحقق من الهوية عبر المنصات — GymEG\r\n\r\nتاريخ التقرير: 29 أكتوبر 2026 — فرع codex/gymeg-full-audit-20261029، baseline ce1a426 مع تعديلات موثقة.\r\n\r\n| الموضع | الدليل | الحالة |\r\n|---|---|---|\r\n| الموقع المحلي | صور جديدة ولقطة landing-brand-corrected | verified locally |\r\n| PWA | manifests واختبارات pixel/dimensions | verified programmatically |\r\n| Android الخمسة | build + alignment + signature وموارد adaptive | device test required |\r\n| Windows | EXE1.1.14 مع ICO/Splash والبيانات الوصفية | build verified / unsigned |\r\n| Supabase | get_project.name=GymEG / ACTIVE_HEALTHY | verified |\r\n| الإنتاج | لم ينشر هذا الفرع | not deployed |\r\n\r\nلا يُستبدل توقيع شهادة Android أو namespace Windows لمجرد تغيير الاسم الظاهر. أي نق
