<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>GYM OS — Arabic voice test</title><style>body{font:22px Arial;max-width:700px;margin:70px auto;background:#f4f1fa;color:#231c38}button,textarea{font:inherit;margin:10px;padding:16px}textarea{width:90%}pre{white-space:pre-wrap;direction:ltr}</style><h1>GYM OS · تجربة الصوت العربي</h1><p>نبرة — صوت فصحى محلي مجاني. لا يتم إرسال النص إلى خادم.</p><textarea id="text">مَرْحَبًا بِكُمْ فِي النَّادِي. يُرْجَى مِنَ الْأَعْضَاءِ الِاسْتِعْدَادُ لِلْحِصَّةِ.</textarea><button id="prepare">تنزيل وتجهيز الصوت</button><button id="play">تجربة النداء</button><button id="stop">إيقاف</button><pre id="status" role="status"></pre><script type="module">import{prepareLocalVoice,playLocalVoice,stopLocalVoice}from './client.js';const status=document.querySelector('#status');document.querySelector('#prepare').onclick=async()=>{status.textContent='Downloading…';try{await prepareLocalVoice();status.textContent='READY — local Arabic voice';}catch(e){status.textContent='ERROR '+e.message;}};document.querySelector('#play').onclick=async()=>{status.textContent='Generating…';try{const result=await playLocalVoice(document.querySelector('#text').value,.9);status.textContent='PASS — playback finished '+JSON.stringify(result);}catch(e){status.textContent='ERROR '+e.message;}};document.querySelector('#stop').onclick=()=>{stopLocalVoice();status.textContent='STOPPED';};</script></html>
